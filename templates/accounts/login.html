{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="w-full max-w-md">
    <div class="bg-slate-900/80 backdrop-blur border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white">SRMS</h1>
            <p class="text-slate-400 text-sm mt-1">Student Result Management System</p>
        </div>
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label for="id_username" class="block text-sm font-medium text-slate-300 mb-2">Username</label>
                <input type="text" name="username" id="id_username" required autofocus
                       class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                       placeholder="Enter username">
            </div>
            <div>
                <label for="id_password" class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                <input type="password" name="password" id="id_password" required
                       class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                       placeholder="Enter password">
            </div>
            <button type="submit" class="w-full py-3 px-4 bg-primary-600 hover:bg-primary-500 text-white font-medium rounded-lg transition-colors">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
